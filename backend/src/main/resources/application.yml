spring:
  application:
    name: realtimecollab-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/realtimecollab}
    username: ${DB_USER:realtimecollab}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:7}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.realtimecollab: INFO
    # Set to DEBUG temporarily when debugging auth/CORS issues, revert to WARN in prod
    org.springframework.security: INFO
    org.springframework.web.socket: WARN
    org.flywaydb: INFO
