services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: realtimecollab
      POSTGRES_USER: realtimecollab
      POSTGRES_PASSWORD: realtimecollab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtimecollab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/realtimecollab
      DB_USER: realtimecollab
      DB_PASSWORD: realtimecollab
      JWT_SECRET: change-this-to-a-long-random-value-in-prod-change-this-to-a-long-random-value
      CORS_ORIGINS: http://localhost:8081,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
